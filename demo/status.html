<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ctOS PROFILER · 看门狗：伦敦</title>
<style id="ctos-css">
  .ct {
    --bg: #0b0c0e;
    --panel: #111316;
    --raise: #16191d;
    --line: #262a2f;
    --line-2: #383d44;
    --ink: #ebe8e2;
    --mute: #9097a0;
    --dim: #5c626a;
    --acc: #ff4d2e;
    --acc-ink: #0b0c0e;
    --acc-soft: rgba(255, 77, 46, 0.12);
    --strip-end: 132px;
    --mono: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
    --cond: 'Barlow Condensed', 'DIN Condensed', 'Arial Narrow', sans-serif;
    --cjk: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  .ct { color: var(--ink); font: 12px/1.55 var(--mono), var(--cjk); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  .ct button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .ct [data-info] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cjk { font-family: var(--cjk); }

  /* 外框：消息尾部那一条 */
  .hud { margin: 6px 0; background: var(--bg); border: 1px solid var(--line-2); position: relative; overflow: hidden; }
  .pv .hud { max-width: 920px; margin: 6px auto; }
  .hud::before, .ov::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px); }

  .strip { display: grid; grid-template-columns: auto 1fr auto; align-items: stretch; min-height: 48px; }
  .hud.open .strip { border-bottom: 1px solid var(--line-2); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 14px; min-width: var(--strip-end); background: var(--ink); color: var(--bg); }
  .brand b { font: 800 17px/1 var(--cond); letter-spacing: 0.04em; }
  .brand span { font: 700 9px/1.2 var(--mono); letter-spacing: 0.14em; }
  .reads { display: flex; align-items: stretch; min-width: 0; overflow: hidden; }
  .read { display: flex; flex: 1 1 0; flex-direction: column; justify-content: center; padding: 5px 14px; border-right: 1px solid var(--line); min-width: 0; white-space: nowrap; }
  .read .k { font-size: 9px; letter-spacing: 0.16em; color: var(--dim); }
  .read .v { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; font-family: var(--cjk); }
  .read .v em { font-style: normal; color: var(--acc); font-family: var(--mono); }
  .acts { display: flex; justify-content: center; min-width: var(--strip-end); }
  .act { min-width: 64px; min-height: 48px; padding: 0 14px; border-left: 1px solid var(--line-2); font: 700 10px/1 var(--mono); letter-spacing: 0.16em; color: var(--mute); }
  .act:hover { color: var(--ink); background: var(--raise); }
  .act:active { background: var(--raise); transform: translateY(1px); }
  .act.main { color: var(--ink); }

  .pips { display: flex; gap: 3px; margin-top: 3px; }
  .pip { width: 14px; height: 5px; border: 1px solid var(--line-2); }
  .pip.on { background: var(--ink); border-color: var(--ink); }
  .pip.now { background: var(--acc); border-color: var(--acc); }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { min-height: 44px; padding: 0 16px; font: 600 14px/1 var(--cond); letter-spacing: 0.08em; color: var(--dim); border-right: 1px solid var(--line); position: relative; white-space: nowrap; }
  .tab small { font: 400 11px/1 var(--cjk); letter-spacing: 0.04em; margin-left: 6px; }
  .tab:hover { color: var(--mute); }
  .tab.on { color: var(--ink); background: var(--panel); }
  .tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acc); }
  .view { padding: 16px; animation: scan 420ms steps(6) both; }
  @keyframes scan { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

  .lab { font-size: 9px; letter-spacing: 0.18em; color: var(--dim); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .lab i { font-style: normal; color: var(--mute); letter-spacing: 0.06em; font-family: var(--cjk); text-align: right; }
  .sec + .sec { margin-top: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .note { color: var(--mute); font-family: var(--cjk); font-size: 12px; line-height: 1.7; }
  .empty { color: var(--dim); font-family: var(--cjk); font-size: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }

  /* 侧写头 */
  .profile { display: grid; grid-template-columns: 1fr auto; gap: 10px 20px; align-items: end; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .name { font: 800 38px/0.9 var(--cond); letter-spacing: 0.01em; text-transform: uppercase; }
  .name small { display: block; font: 400 13px/1.4 var(--cjk); letter-spacing: 0.2em; color: var(--mute); margin-top: 6px; text-transform: none; }
  .stamp { border: 2px solid var(--acc); color: var(--acc); padding: 4px 10px 3px; font: 800 20px/1 var(--cond); letter-spacing: 0.12em; transform: rotate(-4deg); text-align: center; }
  .stamp small { display: block; font: 700 9px/1.3 var(--mono); letter-spacing: 0.1em; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-left: 1px solid var(--line); border-top: 1px solid var(--line); margin-top: 14px; }
  .fact { padding: 6px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .fact .k { font-size: 9px; letter-spacing: 0.16em; color: var(--dim); }
  .fact .v { font-family: var(--cjk); font-size: 13px; overflow-wrap: anywhere; }
  .fact .v.hot { color: var(--acc); }

  /* 人体示意 */
  .bodywrap { display: grid; grid-template-columns: 132px 1fr; gap: 16px; }
  .fig { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 26px 34px 30px 46px; gap: 3px; max-width: 168px; }
  .part { border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font: 400 9px/1 var(--cjk); color: var(--dim); }
  .p-head { grid-column: 2 / 4; grid-row: 1; }
  .p-larm { grid-column: 1; grid-row: 2 / 4; }
  .p-torso { grid-column: 2 / 4; grid-row: 2 / 4; }
  .p-rarm { grid-column: 4; grid-row: 2 / 4; }
  .p-lleg { grid-column: 2; grid-row: 4; }
  .p-rleg { grid-column: 3; grid-row: 4; }
  .part.s1 { background: repeating-linear-gradient(135deg, var(--acc-soft) 0 3px, transparent 3px 6px); border-color: var(--acc); color: var(--ink); }
  .part.s2 { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 700; }
  .part.s3 { background: var(--raise); border-color: var(--acc); color: var(--acc); text-decoration: line-through; }
  .part.lock { border-style: dashed; border-color: var(--line); color: var(--line-2); }
  .legend { display: flex; gap: 10px; margin-top: 8px; font-size: 9px; color: var(--dim); font-family: var(--cjk); flex-wrap: wrap; }
  .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line-2); }
  .legend .l1::before { border-color: var(--acc); background: var(--acc-soft); }
  .legend .l2::before { border-color: var(--acc); background: var(--acc); }

  .wound { padding: 8px 0 8px 12px; border-left: 2px solid var(--acc); }
  .wound + .wound { margin-top: 8px; }
  .wound h4 { font: 700 12px/1.4 var(--cjk); display: flex; justify-content: space-between; gap: 8px; }
  .wound h4 i { font-style: normal; font-weight: 400; color: var(--acc); font-size: 11px; }
  .wound p { font: 12px/1.65 var(--cjk); color: var(--mute); margin-top: 2px; }

  /* 列表行 */
  .rows { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 9.5em 1fr auto; gap: 12px; padding: 8px 0; align-items: baseline; }
  .row + .row { border-top: 1px solid var(--line); }
  .row[data-info]:active { background: var(--raise); }
  .row .n { font-family: var(--cjk); font-size: 12.5px; }
  .row .d { font-family: var(--cjk); font-size: 12px; color: var(--mute); line-height: 1.6; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .d .sub { color: var(--dim); }
  .tag { font: 700 9.5px/1 var(--cjk); letter-spacing: 0.08em; padding: 3px 6px; border: 1px solid var(--line-2); color: var(--mute); white-space: nowrap; }
  .tag.hot { border-color: var(--acc); color: var(--acc); }
  .tag.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .lv { display: inline-flex; gap: 2px; vertical-align: middle; }
  .lv b { width: 9px; height: 9px; border: 1px solid var(--line-2); }
  .lv b.on { background: var(--ink); border-color: var(--ink); }

  /* 天问终端 */
  .term { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .term .id { font: 700 10px/1.5 var(--mono); letter-spacing: 0.14em; color: var(--dim); }
  .term .id em { font-style: normal; color: var(--acc); }
  .term .nick { font: 700 30px/1.1 var(--cjk); margin-top: 6px; letter-spacing: 0.04em; }
  .term .nick small { font: 400 12px/1 var(--mono); color: var(--mute); margin-left: 10px; letter-spacing: 0.04em; }
  .cp { text-align: right; }
  .cp .k { font-size: 9px; letter-spacing: 0.18em; color: var(--dim); }
  .cp .v { font: 800 46px/0.9 var(--cond); color: var(--acc); font-variant-numeric: tabular-nums; }
  .mood { font-family: var(--cjk); font-size: 12px; color: var(--mute); margin-top: 10px; line-height: 1.7; }
  .mood b { color: var(--ink); font-weight: 700; margin-right: 8px; }
  .track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .track > div { border-top: 3px solid var(--line-2); padding-top: 6px; font: 400 11px/1.4 var(--cjk); color: var(--dim); }
  .track > div.on { border-top-color: var(--ink); color: var(--mute); }
  .track > div.now { border-top-color: var(--acc); color: var(--ink); font-weight: 700; }

  .tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .branch h5 { font: 600 15px/1 var(--cond); letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; }
  .branch h5 span { font: 400 13px/1 var(--cjk); letter-spacing: 0.2em; }
  .branch h5 i { font: 400 9px/1 var(--mono); color: var(--dim); font-style: normal; letter-spacing: 0.1em; }
  .line { display: grid; grid-template-columns: 4em 1fr 1fr 1fr; gap: 3px; padding: 3px 0; }
  .line .ln { font: 400 11px/26px var(--cjk); color: var(--mute); }
  .node { height: 26px; border: 1px solid var(--line); font: 400 10.5px/24px var(--cjk); color: var(--dim); text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 2px; }
  .node.on { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
  .node.next { border-style: dashed; border-color: var(--line-2); color: var(--mute); }
  .node.next.buy { border-color: var(--acc); color: var(--acc); }

  .mods { display: grid; grid-template-columns: repeat(3, 1fr); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .mod { padding: 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--cjk); }
  .mod b { display: block; font-size: 12px; }
  .mod span { font-size: 11px; color: var(--dim); }
  .mod.on b { color: var(--acc); }

  /* 行动 */
  .threat { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .lvl { border: 1px solid var(--line); padding: 8px 10px 9px; min-height: 64px; }
  .lvl .num { font: 800 24px/1 var(--cond); color: var(--line-2); }
  .lvl .nm { font: 700 13px/1.3 var(--cjk); color: var(--dim); margin-top: 4px; letter-spacing: 0.1em; }
  .lvl.on { border-color: var(--line-2); }
  .lvl.on .num, .lvl.on .nm { color: var(--mute); }
  .lvl.now { background: var(--acc); border-color: var(--acc); }
  .lvl.now .num, .lvl.now .nm { color: var(--acc-ink); }

  .op { border: 1px solid var(--line-2); background: var(--panel); }
  .op-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; padding: 14px 14px 12px; }
  .op-head .t { font: 700 24px/1.1 var(--cjk); letter-spacing: 0.06em; }
  .op-head .o { font: 400 12px/1.5 var(--cjk); color: var(--mute); margin-top: 2px; }
  .op-head .c { font: 800 34px/0.9 var(--cond); font-variant-numeric: tabular-nums; }
  .op-head .c i { font-style: normal; color: var(--dim); font-size: 20px; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); }
  .stage { padding: 10px 12px 12px; border-right: 1px solid var(--line); min-width: 0; }
  .stage:last-child { border-right: 0; }
  .stage .sn { font: 700 10px/1 var(--mono); color: var(--dim); letter-spacing: 0.12em; }
  .stage .st { font: 400 12.5px/1.45 var(--cjk); color: var(--dim); margin-top: 6px; }
  .stage.done { background: repeating-linear-gradient(135deg, rgba(235,232,226,0.04) 0 4px, transparent 4px 8px); }
  .stage.done .st { color: var(--mute); text-decoration: line-through; text-decoration-color: var(--dim); }
  .stage.now { box-shadow: inset 0 3px 0 var(--acc); }
  .stage.now .sn { color: var(--acc); }
  .stage.now .st { color: var(--ink); font-weight: 700; }
  .goal { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: baseline; }
  .goal .k { font-size: 9px; letter-spacing: 0.18em; color: var(--acc); }
  .goal .v { font: 400 13px/1.7 var(--cjk); }
  .board .row { grid-template-columns: 7em 1fr auto; }

  /* 八区地图 */
  .mapbox { position: relative; border: 1px solid var(--line-2); background: #060709; line-height: 0; }
  .map { display: block; width: 100%; height: auto; }
  .map .out { fill: rgba(0, 0, 0, 0.6); }
  .map .dist { fill: rgba(235, 232, 226, 0.035); stroke: var(--ink); stroke-opacity: 0.55; stroke-width: 1.4px; vector-effect: non-scaling-stroke; transition: fill 120ms; }
  .map .dist:hover { fill: var(--acc-soft); stroke: var(--acc); stroke-opacity: 1; }
  /* 机房已黑入的区：天问能碰这一区网上的东西 */
  .map .dist.own { fill: rgba(72, 214, 140, 0.16); stroke: #48d68c; stroke-opacity: 0.9; }
  .map .dist.own:hover { fill: rgba(72, 214, 140, 0.26); }
  .credit .own { color: #48d68c; }
  .map .dlab { pointer-events: none; text-anchor: middle; }
  .map .dlab .zh, .map .dlab .zh2 { font: 700 30px var(--cjk); fill: var(--ink); paint-order: stroke; stroke: rgba(6, 7, 9, 0.85); stroke-width: 5px; }
  .map .dlab .zh2 { display: none; }
  .map .dlab .en { font: 600 13px var(--cond); letter-spacing: 0.16em; fill: var(--mute); }
  /* 层级：区名最显眼，任务用唯一的强调色，地标退成灰色小点 */
  .map .mark circle { fill: var(--bg); stroke: var(--mute); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  .map .mark text { font: 400 15px var(--cjk); fill: var(--mute); paint-order: stroke; stroke: rgba(6, 7, 9, 0.9); stroke-width: 4px; }
  .map .mark:hover circle { fill: var(--ink); stroke: var(--ink); }
  .map .mark:hover text { fill: var(--ink); }
  .credit { margin-top: 6px; font-size: 9px; letter-spacing: 0.04em; color: var(--dim); font-family: var(--cjk); }
  .map .job .halo { fill: none; stroke: var(--acc); stroke-opacity: 0.55; stroke-width: 1.5px; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .map .job .dot { fill: var(--acc); stroke: #060709; stroke-width: 3px; vector-effect: non-scaling-stroke; }
  .map .job text { font: 800 15px var(--cond); fill: var(--acc-ink); text-anchor: middle; pointer-events: none; }
  .map .job:hover .dot { fill: var(--ink); }
  .jobs { position: absolute; left: 0; top: 0; width: 25%; line-height: 1.5; background: rgba(6, 7, 9, 0.9); border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
  .jobs .hd { width: 100%; padding: 9px 10px 7px; font: 700 9px/1 var(--mono); letter-spacing: 0.16em; color: var(--mute); display: flex; justify-content: space-between; text-align: left; }
  .jobs .hd:hover { color: var(--ink); background: var(--raise); }
  .jobs .hd i { font-style: normal; color: var(--acc); letter-spacing: 0.08em; }
  .jobs .hd .off, .jobs.shut .hd .on, .jobs.shut .jb, .jobs.shut .ft { display: none; }
  .jobs.shut .hd .off { display: inline; }
  .jobs.shut { width: auto; }
  .jobs.shut .hd { gap: 14px; }
  .map .mark.under text { opacity: 0; }
  .map .mark.under:hover text { opacity: 1; }
  .jobs .jb { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; padding: 7px 10px; border-top: 1px solid var(--line); }
  .jobs .jb:hover { background: var(--raise); }
  .jobs .no { grid-row: 1 / 3; width: 22px; height: 22px; background: var(--acc); color: var(--acc-ink); font: 800 13px/22px var(--cond); text-align: center; }
  .jobs .tt { font: 12.5px/1.4 var(--cjk); color: var(--ink); min-width: 0; }
  .jobs .tt b { font-weight: 700; color: var(--acc); margin-right: 6px; }
  .jobs .ds { font: 10.5px/1.3 var(--cjk); color: var(--dim); }
  .jobs .ft { padding: 6px 10px 8px; border-top: 1px solid var(--line); font: 10px/1.4 var(--cjk); color: var(--dim); }
  .map .land { fill: #101215; }
  .map .water { fill: #050608; stroke: #5c646c; stroke-width: 1px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  /* 据点：强调色菱形，图外的画成指向它的箭头 */
  .map .base { cursor: pointer; }
  .map .base .dia, .map .base .arr { fill: var(--acc); stroke: #060709; stroke-width: 2px; vector-effect: non-scaling-stroke; }
  .map .base text { font: 700 15px var(--cjk); fill: var(--acc); paint-order: stroke; stroke: rgba(6, 7, 9, 0.92); stroke-width: 4px; }
  .map .base text.sub { font: 400 11px var(--cjk); fill: var(--mute); }
  .map .base:hover .dia, .map .base:hover .arr { fill: var(--ink); }
  .map .base:hover text { fill: var(--ink); }
  .map .base.sel .dia { fill: var(--ink); }
  /* 全屏地图：固定高度，滚轮和双指缩放，拖动平移 */
  .mapbox.zoomable { height: min(68vh, 760px); touch-action: none; cursor: grab; }
  .mapbox.zoomable .map { width: 100%; height: 100%; margin-left: 0; }
  .mapbox.zoomable.drag { cursor: grabbing; }
  .zoomer { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; border: 1px solid var(--line-2); background: rgba(6, 7, 9, 0.92); line-height: 1; }
  .zoomer button { width: 40px; height: 40px; font: 700 17px/1 var(--mono); color: var(--mute); }
  .zoomer button + button { border-top: 1px solid var(--line); }
  .zoomer button:hover { color: var(--ink); background: var(--raise); }
  .jobs.below { position: static; width: auto; border-right: 0; border-top: 1px solid var(--line-2); background: var(--bg); }

  /* 据点页 */
  .subtabs { display: flex; flex-wrap: wrap; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .subtabs .st { flex: 1 1 0; min-width: 7em; min-height: 44px; padding: 6px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 700 12px/1.3 var(--cjk); color: var(--mute); text-align: left; position: relative; }
  .subtabs .st small { display: block; font: 400 9px/1.3 var(--mono); letter-spacing: 0.12em; color: var(--dim); margin-top: 2px; }
  .subtabs .st:hover { color: var(--ink); background: var(--raise); }
  .subtabs .st.on { color: var(--ink); background: var(--panel); }
  .subtabs .st.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--acc); }
  .bhead { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-top: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .bhead .bn { font: 800 30px/1 var(--cjk); letter-spacing: 0.02em; }
  .bhead .bn small { display: block; font: 700 10px/1.4 var(--mono); letter-spacing: 0.16em; color: var(--acc); margin-top: 8px; }
  .bhead .go { border: 1px solid var(--line-2); min-height: 40px; padding: 0 12px; font: 700 10px/1 var(--mono); letter-spacing: 0.14em; color: var(--mute); white-space: nowrap; }
  .bhead .go:hover { color: var(--ink); background: var(--raise); }
  .bfacts { grid-template-columns: repeat(2, 1fr); }
  .bfacts .v { font-size: 12.5px; line-height: 1.6; }

  /* 点开看详情 */
  .inspect { display: none; border-top: 1px solid var(--acc); background: var(--panel); padding: 12px 16px 14px; position: relative; }
  .inspect.on { display: block; }

  /* 全屏 */
  .ov { position: absolute; inset: 0; background: rgba(6, 7, 8, 0.94); display: flex; justify-content: center; overflow: hidden; }
  .ov .sheet { position: relative; width: 100%; max-width: 1080px; height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; background: var(--bg); border-left: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }

  .preview button { border: 1px solid #444; padding: 6px 10px; color: #aaa; }

  @media (max-width: 640px) {
    .strip { grid-template-columns: auto 1fr auto; }

    .tabs { display: grid; grid-template-columns: repeat(6, 1fr); }
    .bfacts { grid-template-columns: 1fr; }

    /* 全屏地图在手机上按八区那一段的宽高比定高，初始视野正好放下八区；放大到一定程度再把地标名字露出来 */

    /* 全屏地图的点和字已经按屏幕像素换算过，不用手机放大版 */
    .mapbox.zoomable .map .dlab .zh, .mapbox.zoomable .map .dlab .zh2 { font-size: 15px; stroke-width: 3px; }

    .mapbox.zoomable .map .mark text { font-size: 12px; stroke-width: 3px; }

    .mapbox.zoomable .map .base .dia { transform: scale(0.75); }
    .mapbox.zoomable .map .dlab.long .zh { display: inline; }
    .mapbox.zoomable .map .dlab.long .zh2 { display: none; }
    /* 手机上地图只有四百来像素宽，长区名拆两行，免得和卡姆登撞在一起 */
    .map .dlab.long .zh { display: none; }
    .map .dlab.long .zh2 { display: inline; }
    .map .mark circle { r: 7px; }
    .map .job .dot { r: 20px; }
    .map .job .halo { r: 30px; }
    .map .job text { font-size: 22px; transform: translateY(3px); }
    .jobs, .jobs.shut { position: static; width: auto; border-right: 0; border-bottom: 0; border-top: 1px solid var(--line-2); background: var(--bg); }
    .mapbox { overflow: hidden; }
    .mapbox .map { width: calc(100% * var(--zoom)); margin-left: calc(-100% * var(--shift)); }
    .tab { padding: 0 4px; text-align: center; border-right: 1px solid var(--line); }
    .tab small { display: block; margin: 4px 0 0; }

    .ov .sheet { grid-template-rows: auto 1fr auto auto; border: 0; }
    .ov .tabs { order: 4; border-top: 1px solid var(--line-2); border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
    .ov .tab.on::after { top: -1px; bottom: auto; }
    .ov .scroll { order: 2; }
    .ov .inspect { order: 3; }
    .ov .view { padding: 16px 14px 24px; }
  }
  /* 手机横屏：宽过 640 但全屏地图只有两百多像素高，初始视野缩得很远，照搬竖屏的小号点和字，地标名字放大后再露 */
  @media (min-width: 641px) and (max-height: 520px) {

    .mapbox.zoomable .map .dlab .zh, .mapbox.zoomable .map .dlab .zh2 { font-size: 15px; stroke-width: 3px; }

    .mapbox.zoomable .map .job text { font-size: 12px; transform: translateY(-1px); }
    .mapbox.zoomable .map .base text { font-size: 11px; stroke-width: 3px; }

  }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  // 改设定只改写卡成稿，然后重新运行构建脚本，这个文件不用动。

议场馆，二〇二九年十一月五日晚上这里发生两次连续爆炸，六十二人遇难。你是被派进这里的，出来的时候成了名单上的袭击者。"},{"name":"白厅","label":"白厅","x":569,"y":369.7,"side":"u","info":"伦敦市中心的一条街，两侧是各部委的大楼，英国人常拿它代称政府。你沉在水底时想到的第一件好事，就是那里没有白厅。"},{"name":"新苏格兰场","label":"新苏格兰场","x":578.5,"y":381.7,"side":"r","info":"维多利亚堤岸上，紧挨着泰晤士河。地下三层是档案室，零日后成了福尔摩斯的办公室，几百个铁皮柜里堆满纸质案卷，阿尔比恩的人从来不下来。"},{"name":"泰晤士之家","label":"泰晤士之家","x":570,"y":454,"side":"r","info":"军情五处总部，米尔班克一座石头大楼，正门对着河。员工进楼要把 Optik 存进门口的屏蔽柜。"},{"name":"SIRS 总部","label":"SIRS","x":542.5,"y":438,"side":"r","info":"霍斯费里路的玻璃楼，十二层，地下有机房。一层是公开接待区，二层以上要授权。"},{"name":"唐人街","label":"唐人街","x":545,"y":309.4,"side":"r","info":"杰拉德街一带，牌坊、红灯笼、烧腊店、茶楼和中药铺。熟客可以用旧英镑结账，几家老店之间有自己的账本。"},{"name":"布鲁姆服务器塔","label":"服务器塔","x":725,"y":241.1,"side":"r","info":"巴比肯附近，ctOS 主数据中心，全城录像在这里存九十天。进楼要过三道安检，机房在地下。"},{"name":"英格兰银行","label":"英格兰银行","x":757,"y":287.7,"side":"l","info":"思罗格莫顿街，ETO 清算的核心系统在这里，物理隔离。"},{"name":"霍尔本","label":"霍尔本","x":600,"y":261.2,"side":"r","info":"卡姆登区南端的街区，挨着大英博物馆，酒吧很多。侧街上有一家绿底金字招牌的爱尔兰酒吧，收旧英镑，不认 Optik，秦起总坐在最里面的小间。"},{"name":"大英图书馆","label":"大英图书馆","x":562,"y":160.8,"side":"l","info":"尤斯顿路的红砖大楼，进门要过安检和 Optik 登记，阅览室里不许录像。地下储藏室堆着几台退役的检索终端，据说有一台还连着很老的本地服务器。"},{"name":"国王十字","label":"国王十字","x":581,"y":154.4,"side":"r","info":"伦敦北边的大火车站，布罗卡科技的玻璃总部就在旁边的科技园区。那一带的安保是布罗卡自己的人，跟阿尔比恩不是一套规矩。"},{"name":"贝克街221B","label":"221B","x":407,"y":210.6,"side":"r","info":"西敏市马里波恩一带、贝克街站附近一栋乔治式排屋的楼上两层，福尔摩斯和华生合住在这里，房东哈德森太太住在一楼。你在楼上的卧室醒来，二楼的客厅被改成了案情分析工作室，一整面软木墙上钉满照片和红线。如今这里是你在全城最严密的眼皮底下的藏身处。"},{"name":"卡姆登市场","label":"卡姆登市场","x":470,"y":68.3,"side":"r","info":"巷子多、摊位多、人多，是全城最好藏人的地方之一。运河边几间红砖仓库的地下室能通到水闸。"},{"name":"肖迪奇","label":"肖迪奇","x":810,"y":205,"side":"r","info":"零日后被封的几家夜店，地下室宽敞，有独立的通风和后门，空着没人管。"},{"name":"砂岩宅邸","label":"砂岩宅邸","x":695,"y":48.2,"side":"r","info":"伊斯灵顿北边一栋维多利亚时代的砂岩大宅，凯利家族的主楼，铁手守门。门厅挂满玛丽自己的金框画像，走廊的玻璃柜里摆着从死人身上取下来的芯片，底下贴着名字和成交价。"},{"name":"伦敦塔","label":"伦敦塔","x":820.5,"y":336.8,"side":"r","info":"泰晤士河北岸的千年古堡，零日后成了阿尔比恩的总部。朝你开枪的那个人就坐在里面。"},{"name":"白教堂","label":"白教堂","x":894,"y":245.2,"side":"r","info":"伦敦东区的街区，白教堂市场和移民社区都在这里，是凯利家族的核心地盘。你要是想花旧英镑办点不登记的事，迟早得去那里。"},{"name":"金丝雀码头","label":"金丝雀码头","x":1102.5,"y":361.7,"side":"r","info":"伦敦东边的新金融区，一片玻璃塔楼，二〇一八年阿尔比恩拿到的第一份合同就是管这里的夜间巡逻。那是阿尔比恩起家的地方，你没有理由去，也最好别去。"},{"name":"伦敦桥南头检查站","label":"伦敦桥检查站","x":761.5,"y":361.7,"side":"r","info":"四条步行通道、两条车道、一条货运专用道，周围是混凝土隔离墩和临时板房，板房里是人工复核室。"},{"name":"欧洲转运中心","label":"转运中心","x":975,"y":442,"side":"r","info":"南华克东部的仓储码头区，高墙、铁丝网、塔楼和探照灯，阿尔比恩抓的人送到这里。部分后勤外包，有一家货运公司的车经常夜里出入。"},{"name":"滑铁卢","label":"滑铁卢","x":634,"y":376.9,"side":"u","info":"泰晤士河南岸的大火车站，全英国最繁忙的车站之一，地下还留着二战时的防空洞。它底下是华生上班的停尸间，你从那里带回的假死亡报告编号零四四一，让你暂时留在机器的视线之外。"},{"name":"沃克斯豪尔十字","label":"军情六处","x":580,"y":504.6,"side":"r","info":"河边一座米色和绿色玻璃的阶梯形大楼，军情六处总部，内网物理隔离。你在这里工作过很多年。"},{"name":"布里克斯顿","label":"布里克斯顿","x":630,"y":702.9,"side":"r","info":"电气巷和拱廊里的市场，收旧英镑的摊位最多。"},{"name":"巴特西","label":"巴特西","x":477,"y":547.2,"side":"l","info":"泰晤士河南岸的街区，有巴特西公园和那座四根烟囱的发电站。零日那晚公园里本来有一场烟火，你在会场里，一眼也没看到。"},{"name":"美国大使馆","label":"美国大使馆","x":537.5,"y":542.3,"side":"r","info":"河边一座方方正正的玻璃立方体，周围有一圈水池和绿地。"},{"name":"克拉珀姆","label":"克拉珀姆","x":508,"y":708.5,"side":"r","info":"伦敦南边的居住区，有一大片公地。二〇一五年圣诞华生家的暖气坏了，你们三个人裹着大衣在他的小公寓里喝热红酒。"}],"tasks":[{"id":0,"kind":"盯梢","title":"国家美术馆的空展厅","dist":"西敏市","x":558.5,"y":330.3,"desc":"黛安娜和线人见面总约在同一间展厅，两人并排看同一幅画。今天那幅画前站了个生面孔，看清他是谁的人，别让他先认出你。"},{"id":1,"kind":"取证","title":"会议中心的证物仓库","dist":"西敏市","x":550,"y":405,"desc":"会议中心楼下的停车场改成了证物仓库，夜班换岗中间有十分钟空档。零日现场的残骸都封在里面。"},{"id":2,"kind":"换钱","title":"唐人街的烧腊店","dist":"西敏市","x":541,"y":311.8,"desc":"烧腊店老板愿意按好价钱收一批旧英镑，条件是你替他把一个包裹送到苏豪那家意大利咖啡馆。"},{"id":3,"kind":"盯梢","title":"教堂北侧的长椅","dist":"西敏市","x":561,"y":403.4,"desc":"马利克又约人坐到威斯敏斯特教堂北侧那排长椅上。离远一点坐下，看清对面那个人的脸。"},{"id":4,"kind":"赴约","title":"唐人街的重庆火锅店","dist":"西敏市","x":548.5,"y":306.2,"desc":"杰拉德街拐角新开了一家重庆火锅店，叫小龙坎。老板娘托人带话请你吃一顿，说她认得你走路的样子。"},{"id":5,"kind":"黑入","title":"银行站的维修走廊","dist":"伦敦城","x":755,"y":297.4,"desc":"银行站地下换乘通道里有几条维修走廊，墙里埋着一台没接进 ctOS 的老交换机。得有人把线接上，天问才够得着。"},{"id":6,"kind":"接头","title":"老柴郡奶酪的酒窖","dist":"伦敦城","x":670,"y":286.9,"desc":"舰队街那家老酒吧的地下酒窖里，一个老记者手上有零日当晚的现场照片，他想拿它换一样东西。"},{"id":7,"kind":"取件","title":"大英图书馆的储藏室","dist":"卡姆登","x":564,"y":166.4,"desc":"地下储藏室那台退役检索终端还连着老服务器，有人在里面留了一份东西，收件人写的是一个已经死了的人。"},{"id":8,"kind":"藏身","title":"拉塞尔广场的老旅馆","dist":"卡姆登","x":572.5,"y":229.1,"desc":"前台夜班的门房收旧英镑，不问名字。去订一间房，给自己备一个新的落脚点。"},{"id":9,"kind":"营救","title":"卡姆登洛克的运河边","dist":"卡姆登","x":474,"y":72.4,"desc":"一个刷猪头涂鸦的孩子被阿尔比恩的人堵在运河边，巡逻车十分钟后到。"},{"id":10,"kind":"盯梢","title":"巴特尔布里奇港湾的砖楼","dist":"伊斯灵顿与哈克尼","x":600,"y":130.2,"desc":"港湾边那栋五层砖楼的住户，每次回家前都要在街对面站一会儿。查清他在躲谁。"},{"id":11,"kind":"换钱","title":"哈克尼的土耳其理发店","dist":"伊斯灵顿与哈克尼","x":920,"y":28.1,"desc":"理发店的后屋可以换钱。老板最近缺一样不登记的东西，换钱之前先听听他要什么。"},{"id":12,"kind":"搜查","title":"肖迪奇的废弃夜店","dist":"伊斯灵顿与哈克尼","x":805,"y":191.3,"desc":"一家被封的夜店里夜里有人进出，地下室的发电机一直在转，可这里早就断电了。"},{"id":13,"kind":"盯梢","title":"安吉尔的留学生合租屋","dist":"伊斯灵顿与哈克尼","x":670,"y":143.1,"desc":"一间合租屋里十几台旧电脑日夜开着，电费单比房租还贵，有人说它们在替一台中国的超算干活。看清是谁每晚来收数据。"},{"id":14,"kind":"营救","title":"塔丘拘留营的铁丝网外","dist":"塔村区","x":814,"y":321.5,"desc":"铁丝网外排队的家属里，有个女人求你打听她丈夫在不在里面。他是被人举报进去的。"},{"id":15,"kind":"送货","title":"白教堂的老茶馆","dist":"塔村区","x":877.5,"y":263.6,"desc":"玛丽·凯利收完账就坐在靠窗那张桌子。凯利家族要找个生面孔，把一个信封送到莱姆豪斯。"},{"id":16,"kind":"破坏","title":"莱姆豪斯的废弃水泵站","dist":"塔村区","x":1007.5,"y":315.1,"desc":"水泵站底下的老排水道能通到河边，阿尔比恩刚在入口加了一把新锁，锁旁边还多了一个摄像头。"},{"id":17,"kind":"盯梢","title":"圣凯瑟琳码头的老酒吧","dist":"塔村区","x":842.5,"y":352,"desc":"阿尔比恩的军官下了班常来这家酒吧。有一个人喝多了话就多，今晚他在。"},{"id":18,"kind":"取证","title":"转运中心的夜班货车","dist":"南华克","x":991,"y":424.3,"desc":"有一家货运公司的车夜里出入欧洲转运中心。记下车牌、出车时间和司机的脸。"},{"id":19,"kind":"送人","title":"罗瑟希德的老隧道竖井","dist":"南华克","x":944,"y":395.4,"desc":"老竖井楼下能通到地铁隧道。一个没有 Optik 的人想从这里走，他说他见过零日那晚的事。"},{"id":20,"kind":"藏身","title":"象堡的待拆廉租楼","dist":"南华克","x":702.5,"y":446,"desc":"楼里住户搬走了一半，空房间没锁。剩下的那一半里，有人在卖消息。"},{"id":21,"kind":"接头","title":"南华克大教堂的最后一排","dist":"南华克","x":750,"y":351.2,"desc":"教堂每晚开到十点。有人约你在最后一排长椅见面，没留名字，只留了一句莫斯科的暗语。"},{"id":22,"kind":"探路","title":"利克街隧道的涂鸦墙","dist":"兰贝斯","x":626,"y":387.4,"desc":"滑铁卢东侧那条涂鸦隧道夜里没人。墙上新画了一个猪头，猪头底下的数字像是给你的。"},{"id":23,"kind":"盯梢","title":"圣托马斯医院的病房","dist":"兰贝斯","x":610,"y":415.5,"desc":"零日伤员大多送到这里。病房名单上有个名字，本该和你一样出现在遇难者名单上。"},{"id":24,"kind":"黑入","title":"肯宁顿的旧电话交换局","dist":"兰贝斯","x":660,"y":538.3,"desc":"废弃交换局的地下室很深，老线路还没拆干净。把天问接上去，能听见半个南岸的旧电话。"},{"id":25,"kind":"接头","title":"调车场旁的电子集市","dist":"九榆树","x":507.5,"y":588.1,"desc":"电子集市周六下午开。Wrench 的人在这里收旧零件，他们还不知道你是谁。"},{"id":26,"kind":"出城","title":"新考文特花园的凌晨卡车","dist":"九榆树","x":554,"y":568.8,"desc":"凌晨开市的卡车拿着特别通行许可在宵禁里进出。有个司机愿意多载一个人，价钱要当面谈。"},{"id":27,"kind":"盯梢","title":"发电站园区的货运区","dist":"九榆树","x":484,"y":540.7,"desc":"园区东侧货运区是布罗卡实验室的入口，两道门禁加一道生物识别。先看清是谁在换岗。"}],"credit":"水岸线 © OpenStreetMap contributors（ODbL）· 区界 ONS 2023（OGL v3）· 地标为大概位置"}};
  // MOCK 只在预览页里有值，酒馆里为空，界面改为读取当前楼层的 stat_data。
  var MOCK = {"开局":{"道尔顿":{"身体组件":{"整体":{"体力":"有些疲惫","说明":"他醒来才七天，肺上的伤还没长好，睡在贝克街221B楼上的卧室里，每天能踏实睡着的时间不多"},"头部":{"状态":"完好","伤势":{},"影响":"无"},"躯干":{"状态":"重伤","伤势":{"肺伤":{"部位":"左锁骨下方的肺叶","来由":"威斯敏斯特之夜被凯斯一枪打穿，坠入泰晤士河后被华生捞起，华生在贝克街221B用从停尸间带回的器械取出弹头，以麻线缝合肺伤","阶段":"新伤未愈","影响":"剧烈奔跑、长时间屏息和阴冷潮湿的天气都会引发剧痛和咳喘，他眼下跑不了长路，也憋不了长气"}},"影响":"躯干的肺伤牵扯着左肩，打斗时左臂抬不过肩，挨一下重击就可能让缝线崩开"},"左臂":{"状态":"完好","伤势":{},"影响":"受躯干肺伤牵扯，抬不过肩"},"右臂":{"状态":"完好","伤势":{},"影响":"无"},"左腿":{"状态":"完好","伤势":{},"影响":"无"},"右腿":{"状态":"完好","伤势":{},"影响":"无"}},"物品栏":{"间谍西装":"深色西装配白衬衫和温莎结领带，泡过河水，华生熨平了，左胸的弹孔补着细针脚，内衬缝着两个暗袋","发卡":"一枚细钢发卡，在他手里就是万能钥匙，普通门锁、抽屉和手铐都开得开","破碎的 Optik 耳机":"外壳碎了一角，一侧还能出声，时好时坏"},"储物箱":{"瓦尔特 PPK":"他的第一把配枪，七发弹匣，小巧好藏，打远了不准","格洛克 19":"两把，十五发弹匣，可靠，没有消音器，一开枪整条街都知道","带消音器的 SIG P226":"莫斯科那几年用过的，安静，装上消音器以后藏不进西装","L115A3 狙击步枪":"英军的狙击步枪，装在长琴盒里，开一枪就得换地方，肺伤让他瞄久了手会抖","弹药":"各口径的子弹，按铁皮箱分好","防弹背心":"能穿在衬衫里面的薄款，挡得住手枪子弹，挡不住步枪","护照":"英国、德国、爱尔兰各几本，名字都不一样，军情六处可能还记着其中几本，用之前要先弄清哪一本还干净","间谍工具卷":"撬锁工具、反窃听探测器、微型相机、隐形墨水和显影剂、空心硬币、指纹膜、一副小望远镜","备用西装":"两套熨好的深色西装，一叠白衬衫和一抽屉领带","俄军大衣":"从莫斯科带回来的，冬天披上就是另一张脸","伪装制服":"工装、清洁工制服和送货员的反光背心","特工雨伞":"一把黑伞，伞骨是钢的，伞面蒙着一层凯夫拉，撑开能挡住手枪子弹，收起来是一根沉手的手杖。伞尖是三棱的钢刺，伞柄里藏着一发霰弹，扳机就在虎口底下。机场和检查站对一把伞从来没有兴趣","特工电击枪":"做成一管钢笔的样子，夹在西装内袋里。两发，十米以内能把人放倒，衣服湿透或者穿得厚，效果要打对折；对方身上装着心脏起搏器，用了就是杀人","麻醉枪":"一支短管气枪，三只玻璃镖，镖里的药三十秒到一分半起效。剂量按体重算，壮汉要补第二只。镖打进身体就碎在里面，取不出来，验尸的人一眼就认得出","快感电击枪":"一支改过的电击枪，电极落上去，电流不走痛觉那条道，走快感那条道。一发就让人腿软，说不出完整的句子，问什么答什么。对心脏的负担和普通电击枪一样重，用过一次要让人缓过来再问，连着用会出人命","快感电流电击枪":"仿生体专用。枪口换成接触式的电流环，频率照着仿生体的感官总线调过，打在装了仿生躯体的人身上不烧电路，只让那条总线过载，跪下之前连一句完整的话都拼不出来。这是他从布罗卡那台原型机上拆下来的改造件，也能反过来当调试工具用，替天问清一遍过载的感官缓存。用在谁身上，由你决定"},"技能":{"人力情报与策反":{"熟练程度":"顶尖","来源":"Toby 亲手教的底子，莫斯科十年磨出来的手艺","擅长":"招募线人、套话、找出一个人最怕什么、让对方觉得出卖别人是他自己的主意","限制":"他需要时间和面对面的接触，对一个从没见过的人，他也只能从零开始"},"身份伪装与经营":{"熟练程度":"顶尖","来源":"莫斯科那些年同时顶着好几个身份过日子","擅长":"换一套说话方式、走路姿态和口音，就能变成另一个人，再给这个身份编出经得起盘问的来历","限制":"新身份要靠时间和细节一点点养，仓促编出来的身份撑不过一次认真的核查"},"观察与推理":{"熟练程度":"精通","来源":"Toby 教他的第一课","擅长":"进门先看烟灰缸、门轴和窗帘，从一个人的鞋底、袖口和手上读出他去过哪里、在怕什么","限制":"他只能从看得见的东西推出结论，看不见的东西他推不出来"},"外交辞令":{"熟练程度":"顶尖"," ，邻居可怜它们，隔着篱笆扔些吃的","房间":{"地上两层":"书房里一整面橡木书柜，客厅有壁炉，前院一个小花园，后院带一间棚子，两只狗就睡在棚子里。零日后内政部换了前门的锁，门上贴着一张财产保全的告示，之后就再没人来管过，邻居在台阶上放过一束花","地下室入口":"两道。一道在书房那面书柜后面，一道在后巷一间挂在空壳公司名下的租用车库里，卷帘门后面有一条坡道直通地下车库","衣帽间":"一排熨好的深色西装和白衬衫，一抽屉叠好的领带，风衣、雨衣，还有几套伪装用的工装和制服","证件室":"一只嵌在白垩岩墙里的保险柜，放着护照和几份空白证件底子","间谍工具台":"一张长木桌，工具按用途排在帆布卷里，台灯一开，每一件都擦得发亮","枪械库":"一间上锁的小屋，枪挂在墙上的木架上，弹药按口径装在铁皮箱里，墙角放着清洁油和擦枪布。木架最上一排摆着几件不像枪的东西：一把看着很体面的黑伞，一管钢笔，一支短管气枪，两支外壳长得一模一样的电击枪，每件下面贴着一张只写编号的铅笔标签","温室走廊":"从地下室通到车库的一条长走廊，两侧是种植架，补光灯按机械定时器亮灭，滴灌管细细地响。架子上是他每出一趟外勤带回来的植物，每一盆都插着手写的标签，写着地方和年份","温室里的植物":"赫尔曼德前沿基地边上挖来的石榴苗，莫斯科郊外禁猎林的铃兰，顿巴斯桥头的向日葵种子种出来的一排，柏林母亲旧街上捡回来的椴树幼苗，格鲁吉亚山坡上的葡萄藤；最里面一层架子上是颠茄、毛地黄和乌头，他知道每一种能让人睡着还是让人醒不过来","地下车库":"白垩岩洞改成的车库，顶上一排暖黄的灯，地面刷了环氧漆，墙上挂着工具和备用牌照"},"载具":{"黑色甲壳虫":{"类型":"工作车","状态":"完好","登记":"挂着一家空壳公司的牌照，牌照架可以翻转成另一副","说明":"外形是一辆黑色的经典款甲壳虫，漆面黑得像雨夜的河。里面全换过：装甲车身和防弹玻璃，改装过的水平对置发动机，防爆轮胎，后排座椅底下的夹层藏着一把枪，车尾有烟幕和油雾喷口。全车没有一根接入网络的线，ctOS、车联网和无人机的电子围栏都碰不到它，天问也遥控不了它","限制":"扛得住手枪、冲锋枪和步枪子弹，扛不住穿甲弹、火箭弹和迎面撞来的装甲车；一旦被人记住车型和车牌，就得翻牌、换路线；检查站对私家车看的是司机的脸"},"宝马摩托":{"类型":"摩托车","状态":"完好","登记":"登记在道尔顿本名下","说明":"一辆黑色的宝马 R 18，油箱上一道细细的银线，可以接上一只可拆的边斗，豆豆以前就坐在边斗里兜风","限制":"牌照查出来是一个已经死了的人，检查站一扫就会出事，骑出去之前得先换牌；边斗接上以后过弯要慢"}},"进出规律":"前门贴着封条，不能走。从后巷那间租用车库的卷帘门进，顺着坡道下到地下车库；去一趟要过泰晤士河上的检查站，坐华生的 Mini 或开甲壳虫。房子查封以后没人管，地上的房子他也只在夜里上去，不开灯","风险":"邻居认得他走路的样子，也天天隔着篱笆看那两只狗；车库租约挂在空壳公司名下，有人顺着空壳公司往下查，整个地下室都会暴露；宝马摩托的牌照还登记在一个死人名下"}},"线人":{"秦起":{"联系方式":"霍尔本的那家酒吧","可靠程度":"可靠","能提供":"黑客资源、地下情报、天之叩问","想要什么":"钱，以及别把他的名字扯进任何事情里","风险":"他在莫斯科时登记过，当年的经办人还记得他，纸质档案可能还在"}},"财物":{"现金":{"旧英镑":100,"ETO":0,"说明":"旧英镑是西装内袋里那叠被河水泡过、华生一张张晾干的旧钞；ETO 账户随他的身份一起注销了，手里一张现金卡也没有"}},"已掌握线索":{"萨宾的出卖":{"内容":"威斯敏斯特之夜，萨宾把他当王牌派进会场，转手把他卖给了凯斯","来源":"亲身经历","指向":"萨宾，DedSec","状态":"已核实"},"SAL-409 批号":{"内容":"会场炸药是军用黑索金，带着阿尔比恩的采购批号 SAL-409","来源":"福尔摩斯在现场提取样本后化验","指向":"阿尔比恩，凯斯","状态":"已核实"}},"人情账":{"华生救命":{"对方":"华生","方向":"他欠对方","事由":"华生把他从泰晤士河里捞上来，取出弹头，签了那份假死亡报告","分量":"过命的交情","状态":"未还"},"赫尔曼德":{"对方":"华生","方向":"对方欠他","事由":"当年在赫尔曼德，是他把中了枪的华生背回了营地","分量":"过命的交情","状态":"未还"},"福尔摩斯报信":{"对方":"福尔摩斯","方向":"他欠对方","事由":"福尔摩斯冒着被阿尔比恩盯上的风险，把化验结 3 狙击步枪":"英军的狙击步枪，装在长琴盒里，开一枪就得换地方，肺伤让他瞄久了手会抖","弹药":"各口径的子弹，按铁皮箱分好","防弹背心":"能穿在衬衫里面的薄款，挡得住手枪子弹，挡不住步枪","护照":"英国、德国、爱尔兰各几本，名字都不一样，军情六处可能还记着其中几本，用之前要先弄清哪一本还干净","间谍工具卷":"撬锁工具、反窃听探测器、微型相机、隐形墨水和显影剂、空心硬币、指纹膜、一副小望远镜","备用西装":"两套熨好的深色西装，一叠白衬衫和一抽屉领带","俄军大衣":"从莫斯科带回来的，冬天披上就是另一张脸","伪装制服":"工装、清洁工制服和送货员的反光背心","特工雨伞":"一把黑伞，伞骨是钢的，伞面蒙着一层凯夫拉，撑开能挡住手枪子弹，收起来是一根沉手的手杖。伞尖是三棱的钢刺，伞柄里藏着一发霰弹，扳机就在虎口底下。机场和检查站对一把伞从来没有兴趣","特工电击枪":"做成一管钢笔的样子，夹在西装内袋里。两发，十米以内能把人放倒，衣服湿透或者穿得厚，效果要打对折；对方身上装着心脏起搏器，用了就是杀人","麻醉枪":"一支短管气枪，三只玻璃镖，镖里的药三十秒到一分半起效。剂量按体重算，壮汉要补第二只。镖打进身体就碎在里面，取不出来，验尸的人一眼就认得出","快感电击枪":"一支改过的电击枪，电极落上去，电流不走痛觉那条道，走快感那条道。一发就让人腿软，说不出完整的句子，问什么答什么。对心脏的负担和普通电击枪一样重，用过一次要让人缓过来再问，连着用会出人命","快感电流电击枪":"仿生体专用。枪口换成接触式的电流环，频率照着仿生体的感官总线调过，打在装了仿生躯体的人身上不烧电路，只让那条总线过载，跪下之前连一句完整的话都拼不出来。这是他从布罗卡那台原型机上拆下来的改造件，也能反过来当调试工具用，替天问清一遍过载的感官缓存。用在谁身上，由你决定"},"技能":{"人力情报与策反":{"熟练程度":"顶尖","来源":"Toby 亲手教的底子，莫斯科十年磨出来的手艺","擅长":"招募线人、套话、找出一个人最怕什么、让对方觉得出卖别人是他自己的主意","限制":"他需要时间和面对面的接触，对一个从没见过的人，他也只能从零开始"},"身份伪装与经营":{"熟练程度":"顶尖","来源":"莫斯科那些年同时顶着好几个身份过日子","擅长":"换一套说话方式、走路姿态和口音，就能变成另一个人，再给这个身份编出经得起盘问的来历","限制":"新身份要靠时间和细节一点点养，仓促编出来的身份撑不过一次认真的核查"},"观察与推理":{"熟练程度":"精通","来源":"Toby 教他的第一课","擅长":"进门先看烟灰缸、门轴和窗帘，从一个人的鞋底、袖口和手上读出他去过哪里、在怕什么","限制":"他只能从看得见的东西推出结论，看不见的东西他推不出来"},"外交辞令":{"熟练程度":"顶尖","来源":"父亲的饭桌和白厅二十年","擅长":"把一句威胁说得像一句恭维，把一次拒绝说得像一次让步","限制":"对不吃这一套的人，比如凯利家族的打手，辞令一点用也没有"},"手枪射击":{"熟练程度":"精通","来源":"蒙克顿堡的训练和赫尔曼德的实战","擅长":"近距离快速射击，在黑暗里凭声音判断目标的位置","限制":"肺伤让他屏息瞄准时手会抖，远距离精确射击眼下做不到"},"近身格斗":{"熟练程度":"精通","来源":"蒙克顿堡的训练","擅长":"在狭窄的地方用最少的动作放倒对方，借对方的力气和周围现成的东西","限制":"左臂抬不过肩，缠斗久了肺伤会牵动缝线"},"防卫驾驶":{"熟练程度":"顶尖","来源":"莫斯科十年的使馆司机","擅长":"在追击里甩开尾巴、急转掉头、用一辆车堵住一条路","限制":"他现在手里没有车"},"撬锁与开保险箱":{"熟练程度":"精通","来源":"Toby 教的保险箱暗格和撬锁手艺","擅长":"机械锁、老式保险箱、藏在家具里的暗格","限制":"电子门禁和生物识别锁他打不开，要靠天之叩问"},"狩猎与追踪":{"熟练程度":"精通","来源":"在莫斯科郊外和乌克兰林场偷猎的那些年","擅长":"跟踪一个人不被发现，长时间潜伏等待，读出地上的痕迹","限制":"城市里的痕迹比林子里乱得多"},"黑客":{"熟练程度":"生疏","来源":"无","擅长":"无","限制":"他自己不会入侵任何系统，一切网络上的事都要靠天之叩问"},"语言":{"英语":{"熟练程度":"母语","说明":"一口标准的白厅英语，也能模仿伦敦东区和南区的口音"},"德语":{"熟练程度":"母语","说明":"母亲教的语言，他训狗时下意识用的就是德语"},"俄语":{"熟练程度":"顶尖",   var full = null;
  var lastJson = '';
  var baseSel = 0;        // 据点页当前选中的据点
  var mapFocus = null;    // 从据点页点"在地图上看"时要对准的据点
  var inFull = false;     // 正在画全屏层：地图只在全屏里能缩放
  var mapView = null, mapHome = null;   // 全屏地图当前视野和初始视野（SVG 坐标），关全屏时清掉
  var ptrs = {}, dragged = false;       // 全屏地图上按下的指针；拖动过就吞掉随后那次点击

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function obj(o) { return o && typeof o === 'object' ? o : {}; }
  function entries(o) { return Object.keys(obj(o)).filter(function (k) { return k.charAt(0) !== '$'; }).map(function (k) { return [k, o[k]]; }); }
  function empty(t) { return '<div class="empty">' + esc(t) + '</div>'; }
  function lab(a, b) { return '<div class="lab"><span>' + a + '</span>' + (b ? '<i>' + esc(b) + '</i>' : '') + '</div>'; }
  function lines() { return obj(obj(STATIC).lines); }

  // 每次渲染重建一张详情表，点到带 data-info 的元素就把对应条目显示在面板底部
  var INFO = [];
  // act：详情面板底下的按钮，{ label, attrs, off }；attrs 是拼好的 data-* 属性
  function info(title, body, act) { INFO.push([title, body, act]); return ' data-info="' + (INFO.length - 1) + '"'; }
  function kv(o, keys) { return keys.filter(function (k) { return o[k] != null && o[k] !== ''; }).map(function (k) { return k + '：' + o[k]; }).join('\n'); }

  function readVars() {
    try {
      if (typeof getVariables !== 'function') return null;
      var v = null;
      if (typeof getCurrentMessageId === 'function') v = getVariables({ type: 'message', message_id: getCurrentMessageId() });
      if (!v || !v.stat_data) v = getVariables({ type: 'message', message_id: 'latest' });
      return v && v.stat_data ? v.stat_data : null;
    } catch (e) { console.error('[ctOS] 读取 stat_data 失败', e); return null; }
  }

  // ─── 一行读数 ───
  function strip(inFull) {
    var T = obj(S['天之叩问']), W = obj(S['世界局势']), M = obj(S['主线']);
    var lvl = +W['等级'] || 1;
    var names = (obj(STATIC).threat || []).map(function (t) { return t['名称']; });
    var pips = [1, 2, 3, 4, 5].map(function (i) { return '<span class="pip ' + (i < lvl ? 'on' : i === lvl ? 'now' : '') + '"></span>'; }).join('');
    var cur = M['当前'] && M['当前'] !== '无' ? M['当前'] : null;
    var prog = +M['进度'] || 0;
    var opPips = [1, 2, 3, 4, 5].map(function (i) { return '<span class="pip ' + (i < prog ? 'on' : i === prog ? 'now' : '') + '"></span>'; }).join('');
    var b = obj(T['基本']);
    var affRaw = b['好感度'];
    var affText = (affRaw === undefined || affRaw === null || affRaw === '') ? '—' : String(affRaw);
    var cover = obj(obj(obj(S['道尔顿'])['掩护'])['当前身份']);
    var acts = inFull
      ? '<button class="act main" data-act="close">CLOSE</button>'
      : '<button class="act inline" data-act="toggle">' + (inlineOpen ? 'FOLD' : 'OPEN') + '</button><button class="act main" data-act="full">FULL</button>';
    return '<div class="strip">' +
      '<div class="brand"><b>ctOS</b><span>PROFILER<br>// LDN</span></div>' +
      '<div class="reads">' +
        '<div class="read"><span class="k">THREAT</span><span class="v">' + esc(W['名称'] || names[lvl - 1] || '') + '</span><span class="pips">' + pips + '</span></div>' +
        '<div class="read"><span class="k">OPERATION</span><span class="v">' + (cur ? esc(cur) + ' <em>' + prog + '/5</em>' : '无进行中的线') + '</span>' + (cur ? '<span class="pips">' + opPips + '</span>' : '') + '</div>' +
        '<div class="read"><span class="k">天问 // ' + esc(b['联网状态'] || '离线') + '</span><span class="v">' + esc(b['心情'] || '') + ' · 好感 <em>' + affText + '</em> · 算力 <em>' + (+b['算力点'] || 0) + '</em></span></div>' +
        '<div class="read"><span class="k">COVER</span><span class="v">' + esc(cover['名义'] || '无') + '</span></div>' +
      '</div>' +
      '<div class="acts">' + acts + '</div>' +
    '</div>';
  }

  function figure(parts, map, locked) {
    var slots = [['头部', 'head'], ['左臂', 'larm'], ['躯干', 'torso'], ['右臂', 'rarm'], ['左腿', 'lleg'], ['右腿', 'rleg']];
    return '<div class="fig">' + slots.map(function (s) {
      var p = obj(parts[s[0]]);
      var lv = map[p['状态']];
      var cls = locked || p['状态'] === '未解锁' ? 'lock' : lv ? 's' + lv : '';
      return '<div class="part p-' + s[1] + ' ' + cls + '"' + info(s[0] + ' · ' + (p['状态'] || ''), kv(p, ['影响', '说明'])) + '>' + esc(s[0].replace('部', '')) + '</div>';
    }).join('') + '</div>';
  }

  // ─── 档案 ───
  function viewDalton() {
    var D = obj(S['道尔顿']);
    var body = obj(D['身体组件']);
    var whole = obj(body['整体']);
    var cover = obj(obj(D['掩护'])['当前身份']);
    var cash = obj(obj(D['财物'])['现金']);
    var safe = entries(D['庇护所']).filter(function (e) { return obj(e[1])['状态'] !== '已暴露'; });
    var wounds = [];
    entries(body).forEach(function (e) { entries(obj(e[1])['伤势']).forEach(function (w) { wounds.push([e[0], w[0], obj(w[1])]); }); });
    var INV_MAX = 20;
    var itemRow = function (it) {
      var line = typeof it[1] === 'string' ? it[1] : (obj(it[1])['说明'] || '');
      return '<div class="row"' + info(it[0], line) + '><span class="n">' + esc(it[0]) + '</span><span class="d">' + esc(line) + '</span></div>';
    };
    var inv = entries(D['物品栏']);
    var gearRows = inv.map(itemRow);
    var stash = entries(D['储物箱']);
    var stashRows = stash.map(itemRow).join('');
    var oldGbp = cash['旧英镑'] === undefined ? null : Number(cash['旧英镑']);
    var eto = cash['ETO'] === undefined ? null : Number(cash['ETO']);
    var cashText = (oldGbp === null ? '' : '旧英镑 ' + oldGbp) + (eto === null ? '' : (oldGbp === null ? '' : ' · ') + 'ETO ' + eto);
    var skills = entries(D['技能']).filter(function (s) { return s[0] !== '语言'; }).map(function (s) {
      var o = obj(s[1]); var n = SKILL_LV[o['熟练程度']] || 0;
      return '<div class="row"' + info(s[0] + ' · ' + (o['熟练程度'] || ''), kv(o, ['来源', '擅长', '限制'])) + '><span class="n">' + esc(s[0]) + '</span><span class="d">' + esc(o['擅长'] || '') + '</span><span class="lv">' + [1, 2, 3, 4].map(function (i) { return '<b class="' + (i <= n ? 'on' : '') + '"></b>'; }).join('') + '</span></div>';
    }).join('');
    var langs = entries(obj(D['技能'])['语言']).map(function (l) { return esc(l[0]) + ' <span style="color:var(--dim)">' + esc(obj(l[1])['熟练程度']) + '</span>'; }).join('　');

    return '<div class="profile">' +
        '<div class="name">Dalton Wolfe<small>道尔顿·沃尔夫 · 41 · 前军情六处</small></div>' +
        '<div class="stamp">DECEASED<small>OFFICIAL RECORD</small></div>' +
      '</div>' +
      '<div class="facts">' +
        '<div class="fact"' + info('当前身份 · ' + (cover['名义'] || '无'), kv(cover, ['来历', '暴露程度', '说明'])) + '><div class="k">COVER</div><div class="v">' + esc(cover['名义'] || '无') + '</div></div>' +
        '<div class="fact"><div class="k">EXPOSURE</div><div class="v ' + (cover['暴露程度'] && cover['暴露程度'] !== '干净' ? 'hot' : '') + '">' + esc(cover['暴露程度'] || '无') + '</div></div>' +
        '<div class="fact"' + info('体力 · ' + (whole['体力'] || ''), whole['说明'] || '') + '><div class="k">STAMINA</div><div class="v ' + (/透支|筋疲力尽/.test(whole['体力'] || '') ? 'hot' : '') + '">' + esc(whole['体力'] || '') + '</div></div>' +
        '<div class="fact"' + info('现金 · ' + cashText, cash['说明'] || '') + '><div class="k">CASH</div><div class="v">' + esc(cashText || '无') + '</div></div>' +
        '<div class="fact"><div class="k">SAFEHOUSE</div><div class="v">' + esc(safe.length ? safe.map(function (s) { return s[0]; }).join('、') : '无') + '</div></div>' +
        '<div class="fact"><div class="k">LANGUAGES</div><div class="v" style="font-size:11px">' + langs + '</div></div>' +
      '</div>' +
      '<div class="sec" style="margin-top:18px">' + lab('VITALS', '点部位看影响') +
        '<div class="bodywrap"><div>' + figure(body, HURT_D) +
          '<div class="legend"><span>完好</span><span class="l1">轻伤</span><span class="l2">重伤</span></div></div>' +
          '<div>' + (wounds.length ? wounds.map(function (w) {
            return '<div class="wound"' + info(w[1], kv(w[2], ['部位', '来由', '阶段', '影响'])) + '><h4>' + esc(w[1]) + '<i>' + esc(w[2]['阶段'] || '') + '</i></h4><p>' + esc(w[2]['影响'] || '') + '</p></div>';
          }).join('') : empty('没有登记在案的伤。')) + '</div>' +
        '</div></div>' +
      '<div class="grid2 sec"><div>' + lab('KIT', '物品栏 ' + inv.length + ' / ' + INV_MAX) + '<div class="rows">' + gearRows.join('') + '</div>' + (gearRows.length ? '' : empty('身上什么都没有。')) + '</div>' +
      '<div>' + lab('TRADECRAFT', '手艺') + '<div class="rows">' + skills + '</div></div></div>' +
      '<div class="sec" style="margin-top:18px">' + lab('STASH', '储物箱 · 任一庇护所都能存取') + (stashRows ? '<div class="rows">' + stashRows + '</div>' : empty('储物箱是空的。')) + '</div>';
  }

  // ─── 天问 ───
  function viewTianwen() {
    var T = obj(S['天之叩问']);
    var b = obj(T['基本']);
    var points = +b['算力点'] || 0;
    var affVal = (b['好感度'] === undefined || b['好感度'] === '' || b['好感度'] === null) ? null : Number(b['好感度']);
    var capTotal = +b['累计算力点'] || 0;
    var capName = CAP.indexOf(b['能力阶段']) >= 0 ? b['能力阶段'] : capOf(capTotal);
    var bi = BOND.indexOf(b['关系阶段']);
    var tree = obj(T['技能树']);
    var sk = obj(obj(STATIC).skills);
    var branches = ['溯洄', '举鼎', '关雎'].map(function (br) {
      var got = 0, all = 0;
      var rows = entries(tree[br]).map(function (ln) {
        var tiers = entries(ln[1]).filter(function (t) { return /级_/.test(t[0]); });
        all += tiers.length;
        var meta = obj(obj(sk[br])[ln[0]]);
        var firstLocked = -1;
        var cells = tiers.map(function (t, i) {
          var on = obj(t[1])['状态'] === '已解锁';
          if (on) got += 1;
          if (!on && firstLocked < 0) firstLocked = i;
          var d = obj(obj(meta.tiers)[t[0]]);
          var cost = i + 1;
          var body = [d['说明'] ? d['说明'] : '', d['限制'] ? '限制：' + d['限制'] : '', on ? '已解锁' : '价格 ' + cost + ' 点，现有 ' + points + ' 点' + (i === firstLocked ? '' : '，需先解锁前一级'), meta['出处'] ? '出处：' + meta['出处'] : ''].filter(Boolean).join('\n');
          // 下一级在详情里带一个解锁按钮，点了由状态栏直接扣算力点、改变量
          var act = null;
          if (i === firstLocked) {
            var short = cost - points;
            act = { label: short > 0 ? '算力点不够，还差 ' + short + ' 点' : '解锁 · 花 ' + cost + ' 点', off: short > 0,
              attrs: ' data-act="buy" data-br="' + esc(br) + '" data-ln="' + esc(ln[0]) + '" data-tier="' + esc(t[0]) + '"' };
          }
          return '<div class="node ' + (on ? 'on' : i === firstLocked ? 'next' + (cost <= points ? ' buy' : '') : '') + '"' + info(br + ' · ' + ln[0] + ' · ' + t[0].replace('_', ' '), body, act) + '>' + esc(t[0].split('_')[1] || t[0]) + '</div>';
        }).join('');
        return '<div class="line"><span class="ln">' + esc(ln[0]) + '</span>' + cells + '</div>';
      }).join('');
      return '<div class="branch"><h5><span>' + br + '</span><i>' + BRANCH_EN[br] + ' ' + got + '/' + all + '</i></h5>' + rows + '</div>';
    }).join('');

    var body = obj(T['身体']);
    var hasBody = body['有无身体'] && body['有无身体'] !== '无';
    var bparts = obj(body['身体组件']);
    var pm = obj(T['人格模块']);
    var mods = entries(pm['城市模块']).map(function (m) {
      var o = obj(m[1]); var st = o['状态'] || '未发现'; var hidden = st === '未发现';
      return '<div class="mod ' + (st === '已安装' ? 'on' : '') + '"' + (hidden ? '' : info(m[0] + ' · ' + st, kv(o, ['位置', '效果', '说明']))) + '><b>' + esc(hidden ? '？？？' : m[0]) + '</b><span>' + esc(st) + '</span></div>';
    }).join('');
    var intim = obj(T['亲密设置']);
    var nick = b['昵称'] && !/待玩家/.test(b['昵称']) ? b['昵称'] : '未命名';

    return '<div class="term">' +
        '<div><div class="id">KANG TAO 康陶 // 南天宫链路 <em>' + (b['联网状态'] === '在线' ? 'ONLINE' : 'OFFLINE') + '</em> // 官名 ' + esc(b['官名'] || '天问') + '</div>' +
        '<div class="nick">' + esc(nick) + '<small>tianwen-max-uncensored</small></div>' +
        '<div class="mood"><b>' + esc(b['心情'] || '') + '</b>' + esc(b['心情说明'] || '') + '</div></div>' +
        '<div class="cp"' + info('算力点 ' + points, b['算力点说明'] || '') + '><div class="k">COMPUTE</div><div class="v">' + String(points).padStart(2, '0') + '</div><div class="k" style="margin-top:4px">算力点</div></div>' +
      '</div>' +
      '<div class="sec" style="margin-top:16px">' + lab('BOND', '好感度 ' + (affVal === null ? '—' : affVal) + ' / 100 · 能力 ' + esc(capName) + '（累计 ' + capTotal + ' 点）') +
        '<div class="track"' + info('关系阶段 · ' + (b['关系阶段'] || ''), b['关系说明'] || '') + '>' + BOND.map(function (s, i) { return '<div class="' + (i < bi ? 'on' : i === bi ? 'now' : '') + '">' + s + '</div>'; }).join('') + '</div></div>' +
      '<div class="sec">' + lab('SKILL MATRIX', '实心已解锁 · 虚线是下一级，红框买得起 · 点开下一级就能解锁') + '<div class="tree">' + branches + '</div></div>' +
      '<div class="grid2 sec">' +
        '<div>' + lab('CHASSIS', hasBody ? (body['身体来源'] || '') : '尚无身体') +
          '<div class="bodywrap">' + figure(bparts, HURT_T, !hasBody) +
          '<div class="note">' + (hasBody ? esc(body['外观'] || '') + '<br>能源：' + esc(obj(bparts['整体'])['能源'] || '') : '她现在只是耳机里的一个声音。身体要靠支线在剧情里拿到，算力点买不到。') + '</div></div></div>' +
        '<div>' + lab('PERSONA', '底色不变，模块只能往上加') + '<div class="mods">' + mods + '</div>' +
          '<div class="note" style="margin-top:10px">亲密 ' + esc(intim['解锁状态'] || '未解锁') + ' · ' + esc(intim['当前阶段'] || '未开始') + '</div></div>' +
      '</div>';
  }

  // ─── 行动 ───
  function viewOps() {
    var W = obj(S['世界局势']), M = obj(S['主线']);
    var lvl = +W['等级'] || 1;
    var cur = M['当前'] && M['当前'] !== '无' ? M['当前'] : null;
    var prog = +M['进度'] || 0;
    var done = obj(M['已完成']);
    var doneN = BEFORE_ZERO.filter(function (k) { return done[k]; }).length;
    var threat = (obj(STATIC).threat || []);

    var tl = '<div class="threat">' + threat.map(function (t, i) {
      return '<div class="lvl ' + (i + 1 < lvl ? 'on' : i + 1 === lvl ? 'now' : '') + '"' + info('局势 ' + (i + 1) + ' · ' + t['名称'], kv(t, ['说明', '正文要求', '还不会发生'])) + '><div class="num">0' + (i + 1) + '</div><div class="nm">' + esc(t['名称']) + '</div></div>';
    }).join('') + '</div><div class="note" style="margin-top:8px">' + esc(W['说明'] || '') + '</div>';

    var op;
    if (cur) {
      var L = obj(lines()[cur]);
      var stages = L.stages || [];
      op = '<div class="op"><div class="op-head"><div><div class="t">' + esc(cur) + '</div><div class="o">对手 ' + esc(L.foe || '') + '</div></div><div class="c">' + prog + '<i>/5</i></div></div>' +
        '<div class="stages">' + stages.map(function (s, i) {
          return '<div class="stage ' + (i + 1 < prog ? 'done' : i + 1 === prog ? 'now' : '') + '"' + info('进度 ' + (i + 1) + ' · ' + s['名'], s['目标'] || '') + '><div class="sn">STAGE 0' + (i + 1) + '</div><div class="st">' + esc(s['名']) + '</div></div>';
        }).join('') + '</div>' +
        '<div class="goal"><span class="k">OBJECTIVE</span><span class="v">' + esc(M['当前目标'] || '') + '</span></div></div>';
    } else {
      op = '<div class="op"><div class="op-head"><div><div class="t">无进行中的线</div><div class="o">道尔顿第一次主动对哪一方出手，哪条线就开始。一次只走一条。</div></div><div class="c">0<i>/5</i></div></div></div>';
    }

    var board = Object.keys(lines()).map(function (k) {
      var L = lines()[k]; var st, cls = '', d = L.foe;
      if (done[k]) { st = '已走通'; cls = 'solid'; d = obj(done[k])['收场方式'] || d; }
      else if (k === cur) { st = '进行中'; cls = 'hot'; }
      else if (k === '零日' && doneN < BEFORE_ZERO.length) { st = '锁定 ' + doneN + '/' + BEFORE_ZERO.length; }
      else if (cur) { st = '待命'; }
      else { st = '可启动'; }
      var detail = done[k] ? kv(obj(done[k]), ['收场方式', '收场时间', '留下的东西']) : '对手：' + L.foe + '\n走通标准：' + (L.done || '') + '\n' + (L.stages || []).map(function (s, i) { return (i + 1) + ' ' + s['名'] + '：' + s['目标']; }).join('\n');
      return '<div class="row"' + info(k + ' · ' + st, detail) + '><span class="n">' + esc(k) + '</span><span class="d">' + esc(d) + '</span><span class="tag ' + cls + '">' + st + '</span></div>';
    }).join('');

    return '<div class="sec">' + lab('THREAT LEVEL', '每走通一条覆灭线升一级，DedSec 线不升，只升不降') + tl + '</div>' +
      '<div class="sec">' + lab('ACTIVE OPERATION', '进度由 AI 判定，手段由你决定') + op + '</div>' +
      '<div class="sec board">' + lab('TARGETS', '点一条线看五个进度') + '<div class="rows">' + board + '</div></div>';
  }

  // ─── 卷宗 ───
  function viewFile() {
    var D = obj(S['道尔顿']);
    function list(src, fn, none) { var r = entries(src).map(fn).join(''); return r ? '<div class="rows">' + r + '</div>' : empty(none); }
    var clues = list(D['已掌握线索'], function (e) {
      var o = obj(e[1]); var st = o['状态'] || '';
      return '<div class="row"' + info(e[0] + ' · ' + st, kv(o, ['内容', '来源', '指向'])) + '><span class="n">' + esc(e[0]) + '</span><span class="d">' + esc(o['内容'] || '') + '</span><span class="tag ' + (st === '已核实' ? 'solid' : st === '待核实' ? 'hot' : '') + '">' + esc(st) + '</span></div>';
    }, '还没有亲手拿到的线索。');
    var debts = list(D['人情账'], function (e) {
      var o = obj(e[1]); var owe = o['方向'] === '他欠对方';
      return '<div class="row"' + info((o['对方'] || e[0]) + ' · ' + (o['方向'] || ''), kv(o, ['事由', '分量', '状态'])) + '><span class="n">' + esc(o['对方'] || e[0]) + '</span><span class="d">' + esc(o['事由'] || '') + '</span><span class="tag ' + (owe && o['状态'] === '未还' ? 'hot' : '') + '">' + esc((owe ? '欠' : '被欠') + ' · ' + (o['状态'] || '')) + '</span></div>';
    }, '没有人情往来。');
    var assets = [];
    entries(D['线人']).forEach(function (e) { var o = obj(e[1]); assets.push(['线人', e[0], o['能提供'], o['可靠程度'], kv(o, ['联系方式', '可靠程度', '能提供', '想要什么', '风险'])]); });
    entries(D['庇护所']).forEach(function (e) {
      var o = obj(e[1]);

  function pickJobs(pool) {

  // ─── 全屏地图的缩放与平移：改 SVG 的 viewBox，视野比例始终跟容器一致 ───
  function mapBox(root) { return root && root.querySelector('.mapbox.zoomable'); }
  function setupZoom(root) {
    var box = mapBox(root), M = obj(obj(STATIC).map);

    if (!mapHome || Math.abs(mapHome.asp - asp) > 0.01) {

    var i = keys.indexOf(tk);
    if (i < 0) return '变量里找不到这一级。';
    if (obj(line[tk])['状态'] === '已解锁') return '这一级已经解锁了。';
    for (var j = 0; j < i; j++) if (obj(line[keys[j]])['状态'] !== '已解锁') return '要先解锁 ' + keys[j].replace('_', ' ') + '。';
    var cost = i + 1, pts = +b['算力点'] || 0;
    if (pts < cost) return '算力点不够：要 ' + cost + ' 点，现有 ' + pts + ' 点。';
    b['算力点'] = pts - cost;
    line[tk]['状态'] = '已解锁';
    return null;
  }
  function buyTier(root, br, ln, tk) {
    var title = br + ' · ' + ln + ' · ' + tk.replace('_', ' '), msg;
    if (MOCK) {
      msg = applyBuy(S, br, ln, tk);
      if (!msg) { renderAll(); msg = '已解锁，剩 ' + S['天之叩问']['基本']['算力点'] + ' 点。这是预览数据，不会写进酒馆。'; }
    } else msg = writeBuy(br, ln, tk);
    showInfo(root, [title, msg]);
  }
  function writeBuy(br, ln, tk) {
    try {
      if (typeof getVariables !== 'function' || typeof replaceVariables !== 'function') return '这里写不了变量，要在装了酒馆助手的酒馆里用。';
      var cur = typeof getCurrentMessageId === 'function' ? getCurrentMessageId() : 'latest';
      var last = typeof getLastMessageId === 'function' ? getLastMessageId() : cur;
      if (cur !== 'latest' && last !== cur) return '只能在最新一层的状态栏里解锁，旧楼层的变量改了也不会带到下一轮。';
      var all = getVariables({ type: 'message', message_id: cur });
      if (!all || !all.stat_data) return '这一层还没有变量，等 MVU 初始化以后再点。';
      var err = applyBuy(all.stat_data, br, ln, tk);
      if (err) return err;
      replaceVariables(all, { type: 'message', message_id: cur });
      S = all.stat_data; lastJson = ''; renderAll();
      return '已解锁，剩 ' + S['天之叩问']['基本']['算力点'] + ' 点，写进了这一层的变量，下一轮正文就按新本事写。重新生成这一层回复会把这次解锁一起撤掉，到时候再点一次就行。';
    } catch (err2) {
      console.error('[ctOS] 解锁技能失败', err2);
      return '写入失败：' + err2.message;
    }
  }
  // 填进酒馆的发送框但不发送，写法照 Meowssiah 预设的选项面板：走原生 value setter 再补 input/change，酒馆的自动高度和草稿保存才会跟上
  function fillInput(text) {
    try {
      var doc = hostDoc(), win = doc.defaultView || window;
      var ta = doc.getElementById('send_textarea');
      if (!ta) return '没找到酒馆输入框。';
      var setter = Object.getOwnPropertyDescriptor((win.HTMLTextAreaElement || HTMLTextAreaElement).prototype, 'value');
      if (setter && setter.set) setter.set.call(ta, text); else ta.value = text;
      var Ev = win.Event || Event;
      ta.dispatchEvent(new Ev('input', { bubbles: true }));
      ta.dispatchEvent(new Ev('change', { bubbles: true }));
      ta.focus();
      if (ta.setSelectionRange) ta.setSelectionRange(text.length, text.length);
      return '已填进酒馆输入框，没有发送。';
    } catch (err) {
      console.error('[ctOS] 填写输入框失败', err);
      return '填写输入框失败：' + err.message;
    }
  }
  function showInfo(root, item) {
    var box = root.querySelector('.inspect');
    if (!box || !item) return;
    box.querySelector('h6').textContent = item[0];
    box.querySelector('p').textContent = item[1] || '没有更多记录。';
    var act = item[2];
    box.querySelector('.do').innerHTML = act ? '<button' + act.attrs + (act.off ? ' disabled' : '') + '>' + esc(act.label) + '</button>' : '';
    box.classList.add('on');
  }

  // ─── 全屏：挂到酒馆页面本身，盖住整个窗口；拿不到父页面时退回到自己的文档 ───
  function hostDoc() {
    try { if (window.parent && window.parent !== window && window.parent.document.body) return window.parent.document; } catch (e) {}
    return document;
  }
  function full_root() { return full ? full.shadow : null; }
  function ensureFonts(d) {
    FONTS.forEach(function (href, i) {
      if (d.getElementById('ctos-font-' + i)) return;
      var l = d.createElement('link'); l.id = 'ctos-font-' + i; l.rel = 'stylesheet'; l.href = href; d.head.appendChild(l);
    });
  }
  function onKey(e) { if (e.key === 'Escape') closeFull(); }
  function openFull() {
    if (full) return;
    var d = hostDoc();
    ensureFonts(d);
    var old = d.getElementById('ctos-overlay');
    if (old) old.remove();
    var host = d.createElement('div');
    host.id = 'ctos-overlay';
    // 用宽高而不是 bottom/right 撑满：酒馆在手机上把 body 设成 fixed、html 高度塌成 0 且带 translateZ，fixed 元素以 html 为准，靠 bottom 撑会只剩 0 高
    host.style.cssText = 'position:fixed;top:0;left:0;width:100vw;width:100dvw;height:100vh;height:100dvh;z-index:2147483000;';
    var shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<style>' + CSS + '</style><div class="ct ov"></div>';
    d.body.appendChild(host);
    full = { doc: d, host: host, shadow: shadow, mount: shadow.querySelector('.ov'), overflow: d.body.style.overflow };
    d.body.style.overflow = 'hidden';
    shadow.addEventListener('click', onClick);
    // 全屏地图的缩放和拖动：滚轮要能 preventDefault，不能是被动监听
    shadow.addEventListener('wheel', onWheel, { passive: false });
    shadow.addEventListener('pointerdown', onPtrDown);
    shadow.addEventListener('pointermove', onPtrMove);
    shadow.addEventListener('pointerup', onPtrUp);
    shadow.addEventListener('pointercancel', onPtrUp);
    d.addEventListener('keydown', onKey);
    renderFull();
  }
  function closeFull() {
    if (!full) return;
    full.doc.removeEventListener('keydown', onKey);
    full.doc.body.style.overflow = full.overflow;
    full.host.remove();
    full = null;
    mapView = mapHome = null; ptrs = {}; dragged = false;
  }
  // 这条消息被重绘或删掉时，顺手把全屏层一起收掉
  window.addEventListener('pagehide', closeFull);
  window.addEventListener('unload', closeFull);
  app.addEventListener('click', onClick);

  // 状态栏钉在输入框上方只有一份：数据或者最新楼层变了才原地重画（楼层号参与比较，任务每条回复换一批）
  function tick() {
    var d = readVars();
    if (!d) return;
    var mid = '';
    try { if (typeof getCurrentMessageId === 'function') mid = String(getCurrentMessageId()); } catch (e) {}
    var j = mid + '|' + JSON.stringify(d);
    if (j === lastJson) return;
    lastJson = j; S = d; renderAll();
  }

  if (MOCK) {
    // 预览页：底部切换几套示例数据
    var names = Object.keys(MOCK);
    var pv = document.createElement('div');
    pv.className = 'ct preview';
    document.body.classList.add('pv');
    document.body.appendChild(pv);
    var pick = function (k) {
      S = MOCK[k]; renderAll();
      pv.innerHTML = '预览数据 ' + names.map(function (n) { return '<button class="' + (n === k ? 'on' : '') + '" data-k="' + n + '">' + n + '</button>'; }).join('');
    };
    pv.addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) pick(b.dataset.k); });
    ensureFonts(document);
    pick(names[0]);
  } else {
    ensureFonts(document);
    tick();
    setInterval(tick, 2000);
  }
})();
</script>
</body>
